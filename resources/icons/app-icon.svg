<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#635BFF"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx=".25" cy=".15" r=".8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset=".6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFF6D6"/>
      <stop offset=".55" stop-color="#E9B949"/>
      <stop offset="1" stop-color="#A9761A"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- Mark sits inside the central 60% so maskable crops never clip it -->
  <g fill="#FFFFFF">
    <rect x="166" y="150" width="44" height="212" rx="18"/>
    <rect x="166" y="150" width="172" height="44" rx="18"/>
    <rect x="166" y="234" width="140" height="44" rx="18"/>
    <rect x="166" y="318" width="172" height="44" rx="18"/>
  </g>
  <circle cx="352" cy="256" r="26" fill="url(#gold)"/>
</svg>
