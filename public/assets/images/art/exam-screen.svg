<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" fill="none" role="img" aria-label="Computer-based exam screen with score and timer">
  <style>
    .float-a { animation: fa 6s ease-in-out infinite; }
    .float-b { animation: fb 7s ease-in-out infinite; }
    .float-c { animation: fa 8s ease-in-out infinite reverse; }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 196px 248px; }
    @keyframes fa { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes fb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
    @media (prefers-reduced-motion: reduce) { .float-a, .float-b, .float-c, .pulse { animation: none; } }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F5F4FF"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4E2F7"/><stop offset="1" stop-color="#C9C5EA"/></linearGradient>
    <linearGradient id="stand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9E7F8"/><stop offset="1" stop-color="#CFCBEB"/></linearGradient>
    <radialGradient id="orbViolet" cx=".32" cy=".28" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".22" stop-color="#C4B5FD"/><stop offset=".7" stop-color="#7C3AED"/><stop offset="1" stop-color="#4C1D95"/></radialGradient>
    <radialGradient id="orbGold" cx=".32" cy=".28" r=".75"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".25" stop-color="#F7D774"/><stop offset=".72" stop-color="#D4A12A"/><stop offset="1" stop-color="#8A5A0B"/></radialGradient>
    <radialGradient id="orbCyan" cx=".32" cy=".28" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".25" stop-color="#A5F3FC"/><stop offset=".72" stop-color="#06B6D4"/><stop offset="1" stop-color="#0E7490"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2E1065" flood-opacity=".14"/></filter>
  </defs>

  <!-- ground glow -->
  <ellipse cx="280" cy="372" rx="210" ry="22" fill="#4338CA" opacity=".12" filter="url(#soft)"/>
  <ellipse cx="300" cy="150" rx="190" ry="120" fill="#A78BFA" opacity=".16" filter="url(#soft)"/>

  <!-- monitor: thickness layer, then face -->
  <g filter="url(#lift)">
    <path d="M236 316h104l14 34H222z" fill="url(#stand)"/>
    <rect x="198" y="346" width="180" height="12" rx="6" fill="#D9D6F1"/>
    <rect x="96" y="70" width="372" height="252" rx="24" fill="url(#edge)"/>
    <rect x="84" y="58" width="372" height="252" rx="24" fill="url(#screen)" stroke="#FFFFFF" stroke-width="2"/>
  </g>
  <!-- screen content -->
  <g>
    <circle cx="112" cy="84" r="5" fill="#FDA4AF"/><circle cx="128" cy="84" r="5" fill="#FCD34D"/><circle cx="144" cy="84" r="5" fill="#86EFAC"/>
    <rect x="300" y="76" width="132" height="16" rx="8" fill="#EEF0FF"/>
    <rect x="308" y="81" width="74" height="6" rx="3" fill="url(#brand)"/>
    <text x="108" y="128" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#8B8BA7" letter-spacing="1.2">QUESTION 12 OF 40</text>
    <rect x="108" y="142" width="250" height="10" rx="5" fill="#1E1B4B" opacity=".82"/>
    <rect x="108" y="160" width="190" height="10" rx="5" fill="#1E1B4B" opacity=".82"/>
    <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">
      <rect x="108" y="186" width="160" height="34" rx="12" fill="#FFFFFF" stroke="#E7E6F5"/>
      <circle cx="128" cy="203" r="9" fill="#F3F2FC"/><text x="124" y="207" fill="#6B6B8A">A</text><rect x="146" y="199" width="96" height="8" rx="4" fill="#D9D8EA"/>
      <rect x="280" y="186" width="160" height="34" rx="12" fill="url(#brand)"/>
      <circle cx="300" cy="203" r="9" fill="#FFFFFF" opacity=".95"/><path d="m295.5 203 3 3 6-6" stroke="#6D28D9" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><rect x="318" y="199" width="96" height="8" rx="4" fill="#FFFFFF" opacity=".75"/>
      <rect x="108" y="230" width="160" height="34" rx="12" fill="#FFFFFF" stroke="#E7E6F5"/>
      <circle cx="128" cy="247" r="9" fill="#F3F2FC"/><text x="124" y="251" fill="#6B6B8A">C</text><rect x="146" y="243" width="80" height="8" rx="4" fill="#D9D8EA"/>
      <rect x="280" y="230" width="160" height="34" rx="12" fill="#FFFFFF" stroke="#E7E6F5"/>
      <circle cx="300" cy="247" r="9" fill="#F3F2FC"/><text x="296" y="251" fill="#6B6B8A">D</text><rect x="318" y="243" width="88" height="8" rx="4" fill="#D9D8EA"/>
    </g>
    <rect x="108" y="280" width="332" height="6" rx="3" fill="#EEEDF8"/>
    <rect x="108" y="280" width="112" height="6" rx="3" fill="url(#brand)"/>
  </g>

  <!-- floating score card -->
  <g class="float-a">
    <g filter="url(#lift)">
      <rect x="392" y="196" width="150" height="112" rx="20" fill="#E8E5FA"/>
      <rect x="384" y="188" width="150" height="112" rx="20" fill="#FFFFFF" stroke="#F0EEFB"/>
    </g>
    <circle cx="430" cy="244" r="26" stroke="#EEEDF8" stroke-width="8"/>
    <circle cx="430" cy="244" r="26" stroke="url(#brand)" stroke-width="8" stroke-linecap="round" stroke-dasharray="150 164" transform="rotate(-90 430 244)"/>
    <text x="430" y="249" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#1E1B4B">92%</text>
    <text x="466" y="232" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#8B8BA7">SCORE</text>
    <text x="466" y="252" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#1E1B4B">A1</text>
    <rect x="466" y="262" width="48" height="6" rx="3" fill="#D1FAE5"/>
  </g>

  <!-- floating timer chip -->
  <g class="float-b">
    <g filter="url(#lift)"><rect x="36" y="196" width="128" height="52" rx="18" fill="#FFFFFF" stroke="#F0EEFB"/></g>
    <circle cx="64" cy="222" r="12" fill="#FEF3C7"/>
    <circle cx="64" cy="222" r="6.5" stroke="#B45309" stroke-width="2"/><path d="M64 218.5v3.8l2.4 1.4" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
    <text x="84" y="218" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#8B8BA7" letter-spacing="1">TIME LEFT</text>
    <text x="84" y="235" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" fill="#1E1B4B">08:42</text>
  </g>

  <!-- glossy orbs -->
  <g class="float-c"><circle cx="482" cy="86" r="30" fill="url(#orbViolet)"/><ellipse cx="474" cy="74" rx="10" ry="6" fill="#FFFFFF" opacity=".55"/></g>
  <g class="float-a"><circle cx="58" cy="118" r="18" fill="url(#orbGold)"/><ellipse cx="53" cy="111" rx="6" ry="3.5" fill="#FFFFFF" opacity=".6"/></g>
  <g class="float-b"><circle cx="150" cy="356" r="11" fill="url(#orbCyan)"/></g>
  <g class="pulse" fill="#A78BFA"><path d="M520 150l3 7 7 3-7 3-3 7-3-7-7-3 7-3z"/><path d="M30 290l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#F7C948"/></g>
</svg>
