<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" fill="none" role="img" aria-label="Result analytics cards with a rising chart and a gold medal">
  <style>
    .float-a { animation: fa 6s ease-in-out infinite; }
    .float-b { animation: fb 7s ease-in-out infinite; }
    .grow { animation: grow 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
    .grow:nth-of-type(2) { animation-delay: .2s; } .grow:nth-of-type(3) { animation-delay: .4s; } .grow:nth-of-type(4) { animation-delay: .6s; } .grow:nth-of-type(5) { animation-delay: .8s; }
    @keyframes fa { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes fb { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(8px); } }
    @keyframes grow { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(.82); } }
    @media (prefers-reduced-motion: reduce) { .float-a, .float-b, .grow { animation: none; } }
  </style>
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#6366F1"/></linearGradient>
    <linearGradient id="barSoft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDD6FE"/><stop offset="1" stop-color="#E0E7FF"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5CF6" stop-opacity=".28"/><stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9E6FA"/><stop offset="1" stop-color="#CEC9EC"/></linearGradient>
    <radialGradient id="orbGold" cx=".32" cy=".28" r=".75"><stop offset="0" stop-color="#FFFBEA"/><stop offset=".25" stop-color="#F7D774"/><stop offset=".72" stop-color="#D4A12A"/><stop offset="1" stop-color="#8A5A0B"/></radialGradient>
    <radialGradient id="orbCyan" cx=".32" cy=".28" r=".75"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".25" stop-color="#A5F3FC"/><stop offset=".72" stop-color="#06B6D4"/><stop offset="1" stop-color="#0E7490"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2E1065" flood-opacity=".14"/></filter>
  </defs>

  <ellipse cx="280" cy="372" rx="210" ry="22" fill="#4338CA" opacity=".12" filter="url(#soft)"/>
  <ellipse cx="270" cy="160" rx="190" ry="120" fill="#A78BFA" opacity=".15" filter="url(#soft)"/>

  <!-- back card -->
  <g filter="url(#lift)">
    <rect x="132" y="66" width="300" height="200" rx="24" fill="url(#edge)" transform="rotate(-6 282 166)"/>
  </g>
  <!-- main card -->
  <g filter="url(#lift)">
    <rect x="100" y="104" width="332" height="230" rx="24" fill="#E8E5FA"/>
    <rect x="90" y="94" width="332" height="230" rx="24" fill="#FFFFFF" stroke="#F0EEFB"/>
  </g>
  <text x="116" y="130" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#8B8BA7" letter-spacing="1.2">CLASS AVERAGE · SS2</text>
  <text x="116" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26" font-weight="800" fill="#1E1B4B">78.4%</text>
  <rect x="210" y="144" width="54" height="22" rx="11" fill="#ECFDF5"/>
  <text x="237" y="159" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#047857">+6.2%</text>
  <g>
    <rect class="grow" x="128" y="236" width="28" height="64" rx="7" fill="url(#barSoft)"/>
    <rect class="grow" x="176" y="214" width="28" height="86" rx="7" fill="url(#barSoft)"/>
    <rect class="grow" x="224" y="226" width="28" height="74" rx="7" fill="url(#barSoft)"/>
    <rect class="grow" x="272" y="196" width="28" height="104" rx="7" fill="url(#bar)"/>
    <rect class="grow" x="320" y="182" width="28" height="118" rx="7" fill="url(#bar)"/>
  </g>
  <path d="M142 222 C176 200 200 210 238 204 S300 170 334 160 L378 150 L378 300 L142 300Z" fill="url(#area)"/>
  <path d="M142 222 C176 200 200 210 238 204 S300 170 334 160 L378 150" stroke="url(#brand)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="378" cy="150" r="7" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="3.5"/>
  <rect x="116" y="306" width="282" height="1.5" fill="#EEEDF8"/>

  <!-- medal -->
  <g class="float-a">
    <path d="M446 40l-12 44h20l14-30z" fill="#6366F1"/><path d="M494 40l12 44h-20l-14-30z" fill="#A855F7"/>
    <circle cx="470" cy="110" r="38" fill="url(#orbGold)"/>
    <circle cx="470" cy="110" r="26" stroke="#FFF3C4" stroke-width="2.5" opacity=".9"/>
    <path d="m470 95 4.6 9.4 10.4 1.5-7.5 7.3 1.8 10.3-9.3-4.9-9.3 4.9 1.8-10.3-7.5-7.3 10.4-1.5z" fill="#FFF8DC"/>
    <ellipse cx="458" cy="94" rx="10" ry="5" fill="#FFFFFF" opacity=".5"/>
  </g>
  <!-- top student chip -->
  <g class="float-b">
    <g filter="url(#lift)"><rect x="380" y="232" width="152" height="64" rx="20" fill="#FFFFFF" stroke="#F0EEFB"/></g>
    <circle cx="410" cy="264" r="16" fill="url(#brand)"/>
    <text x="410" y="268.5" text-anchor="middle" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#FFFFFF">TO</text>
    <text x="434" y="259" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#8B8BA7" letter-spacing="1">TOP SCORE</text>
    <text x="434" y="276" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#1E1B4B">Tunde · 97%</text>
  </g>
  <g class="float-b"><circle cx="64" cy="232" r="14" fill="url(#orbCyan)"/></g>
</svg>
