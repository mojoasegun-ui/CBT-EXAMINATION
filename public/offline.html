<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="noindex">
    <title>You are offline · ExamCore</title>
    <style>
        :root { --ink: #0c0c1d; --muted: #62647a; --line: #ececf3; --brand: #635bff; --brand2: #a855f7; }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; color: var(--ink); background:
            radial-gradient(60% 50% at 85% 0%, rgba(168,85,247,.10), transparent 70%), radial-gradient(50% 45% at 0% 10%, rgba(99,91,255,.08), transparent 70%), #fff;
            font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        main { width: 100%; max-width: 440px; text-align: center; }
        .badge { width: 72px; height: 72px; margin: 0 auto; border-radius: 24px; display: grid; place-items: center; color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand2)); box-shadow: 0 18px 36px -14px rgba(99,91,255,.7); }
        h1 { margin: 28px 0 8px; font-size: 30px; line-height: 1.15; letter-spacing: -.02em; }
        p { margin: 0; color: var(--muted); }
        ul { margin: 24px 0 0; padding: 16px 20px; list-style: none; text-align: left; border: 1px solid var(--line); border-radius: 20px; background: #fafafd; font-size: 14px; color: var(--muted); }
        li { padding: 6px 0 6px 26px; position: relative; } li::before { content: "✓"; position: absolute; left: 4px; color: #10b981; font-weight: 700; }
        button { margin-top: 28px; min-height: 48px; padding: 0 28px; border: 0; border-radius: 999px; color: #fff; font: inherit; font-weight: 600; cursor: pointer;
            background: linear-gradient(135deg, var(--brand), var(--brand2)); box-shadow: 0 10px 22px -8px rgba(99,91,255,.6); }
        button:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
        .status { margin-top: 14px; font-size: 13px; }
    </style>
</head>
<body>
<main>
    <div class="badge" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h.01"/><path d="M8.5 16.43a5 5 0 0 1 7 0"/><path d="M5 12.86a10 10 0 0 1 5.17-2.69"/><path d="M19 12.86a10 10 0 0 0-2-1.52"/><path d="M2 8.82a15 15 0 0 1 4.18-2.64"/><path d="M22 8.82a15 15 0 0 0-11.29-3.76"/><path d="m2 2 20 20"/></svg>
    </div>
    <h1>You’re offline</h1>
    <p>This page needs an internet connection. Check your data or Wi-Fi and try again.</p>
    <ul>
        <li>Anything you were typing in forms is kept on this device.</li>
        <li>The app opens instantly again once you are back online.</li>
        <li>Exam answers already saved stay saved on the server.</li>
    </ul>
    <button type="button" id="retry">Try again</button>
    <p class="status" id="status" aria-live="polite"></p>
</main>
<script>
    const retry = () => { document.getElementById('status').textContent = 'Checking connection…'; location.reload(); };
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
</script>
</body>
</html>
